<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sportradar Sports Calendar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Navigation -->
      <nav class="navbar">
        <h1>Sportradar Calendar</h1>
        <div class="nav-buttons">
          <button id="calendar-btn" class="nav-btn active">Calendar</button>
          <button id="add-event-btn" class="nav-btn">Add Event</button>
        </div>
      </nav>

      <!-- Calendar Page -->
      <div id="calendar-page" class="page">
        <div class="calendar-header">
          <button id="prev-month">&lt; Previous</button>
          <h2 id="current-month">October 2025</h2>
          <button id="next-month">Next &gt;</button>
        </div>

        <div class="calendar">
          <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
          </div>
          <div id="calendar-days" class="calendar-days">
            <!-- Days will be added by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Add Event Page -->
      <div id="add-event-page" class="page" style="display: none">
        <h2>Add New Event</h2>
        <form id="add-event-form">
          <div>
            <label>Date:</label>
            <input type="date" id="event-date" required />
          </div>

          <div>
            <label>Time:</label>
            <input type="time" id="event-time" required />
          </div>

          <div>
            <label>Sport:</label>
            <select id="event-sport" required>
              <option value="">Select Sport</option>
              <option value="football">Football</option>
              <option value="basketball">Basketball</option>
              <option value="ice-hockey">Ice Hockey</option>
              <option value="tennis">Tennis</option>
            </select>
          </div>

          <div>
            <label>Home Team:</label>
            <input type="text" id="home-team" required />
          </div>

          <div>
            <label>Away Team:</label>
            <input type="text" id="away-team" required />
          </div>

          <div>
            <label>Competition:</label>
            <input type="text" id="competition" required />
          </div>

          <button type="submit">Add Event</button>
        </form>
      </div>
    </div>

    <!-- Event Modal -->
    <div id="event-modal" class="modal" style="display: none">
      <div class="modal-content">
        <span id="close-modal" class="close">&times;</span>
        <div id="event-details"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
